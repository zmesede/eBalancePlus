services:
  mysql:
    image: mysql:8.0
    container_name: ebalance-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ebalance
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ebalance-backend
    env_file:
      - .env
    depends_on:
      - mysql
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ebalance-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
